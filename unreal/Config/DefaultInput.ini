[/Script/Engine.InputSettings]
; The C++ code binds these named axes and actions, so no editor input
; assets are needed. Keyboard and gamepad, like the Godot version.
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent
bEnableMouseSmoothing=False

+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="Throttle",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="Throttle",Scale=-1.000000,Key=Down)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=Gamepad_RightTriggerAxis)
+AxisMappings=(AxisName="Throttle",Scale=-1.000000,Key=Gamepad_LeftTriggerAxis)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=Right)
+AxisMappings=(AxisName="Steer",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Steer",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=Gamepad_LeftX)

+ActionMappings=(ActionName="ToggleBlades",Key=B)
+ActionMappings=(ActionName="ToggleBlades",Key=Gamepad_FaceButton_Left)
+ActionMappings=(ActionName="Hop",Key=SpaceBar)
+ActionMappings=(ActionName="Hop",Key=Gamepad_FaceButton_Top)
+ActionMappings=(ActionName="Pause",Key=P)
+ActionMappings=(ActionName="Pause",Key=Escape)
+ActionMappings=(ActionName="Pause",Key=Gamepad_Special_Right)
+ActionMappings=(ActionName="Restart",Key=R)
+ActionMappings=(ActionName="Restart",Key=Gamepad_Special_Left)

+AxisConfig=(AxisKeyName="Gamepad_LeftX",AxisProperties=(DeadZone=0.200000,Exponent=1.000000,Sensitivity=1.000000))
