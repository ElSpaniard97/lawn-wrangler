# Tests Babylon and Godot; publishes Babylon web and Godot desktop builds
# downloads, and publishes it all to GitHub Pages every time you push to the
# main branch. Pull requests run the tests only.
# Actions are pinned to full commit SHAs (version in the comment) so a moved tag
# cannot change what runs here; Dependabot keeps them up to date. Godot itself
# is downloaded and checksum-verified by .github/scripts/setup-godot.sh.
name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-web-${{ hashFiles('.github/scripts/setup-godot.sh') }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babylon/package-lock.json
      - name: Test and build Babylon browser game
        working-directory: babylon
        run: |
          npm ci
          npm test
          npm run build
      - name: Install pinned Godot (checksum verified)
        run: .github/scripts/setup-godot.sh
      - name: Run tests
        run: |
          godot --headless --path godot --import
          godot --headless --path godot --script res://tests/run_tests.gd

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-web-${{ hashFiles('.github/scripts/setup-godot.sh') }}
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: babylon/package-lock.json
      - name: Test and build Babylon browser game
        working-directory: babylon
        run: |
          npm ci
          npm test
          npm run build
      - name: Install pinned Godot (checksum verified)
        run: .github/scripts/setup-godot.sh
      - name: Export game
        run: |
          mkdir -p site/play
          godot --headless --path godot --import
          cp -R babylon/dist/. site/play/
          cp web/index.html web/credits.html site/
      - name: Export desktop downloads
        run: |
          mkdir -p build/windows build/linux site/download
          godot --headless --path godot --export-release Windows ../build/windows/LawnWrangler.exe
          godot --headless --path godot --export-release Linux ../build/linux/LawnWrangler.x86_64
          godot --headless --path godot --export-release macOS ../build/LawnWrangler-macos.zip
          (cd build/windows && zip -q -9 ../../site/download/LawnWrangler-windows.zip LawnWrangler.exe)
          (cd build/linux && zip -q -9 ../../site/download/LawnWrangler-linux.zip LawnWrangler.x86_64)
          mv build/LawnWrangler-macos.zip site/download/
          (cd site/download && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
