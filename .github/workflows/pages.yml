# Tests the Godot game, exports it for the web and publishes it to GitHub
# Pages every time you push to the main branch. Pull requests run the tests only.
# Actions are pinned to full commit SHAs (version in the comment) so a moved tag
# cannot change what runs here; Dependabot keeps them up to date. Godot itself
# is downloaded and checksum-verified by .github/scripts/setup-godot.sh.
name: Publish game to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing gets write access unless a job asks for it below.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-web-${{ hashFiles('.github/scripts/setup-godot.sh') }}
      - name: Install pinned Godot (checksum verified)
        run: .github/scripts/setup-godot.sh
      - name: Run tests
        run: |
          godot --headless --path godot --import
          godot --headless --path godot --script res://tests/run_tests.gd

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-web-${{ hashFiles('.github/scripts/setup-godot.sh') }}
      - name: Install pinned Godot (checksum verified)
        run: .github/scripts/setup-godot.sh
      - name: Export game
        run: |
          mkdir -p site/play
          godot --headless --path godot --import
          godot --headless --path godot --export-release Web ../site/play/index.html
          test -f site/play/index.wasm
          cp web/index.html web/credits.html site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
